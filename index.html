<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Chore Schedule</title>
<meta name="description" content="Chore tracker for Isabel, Nuno and Zion.">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#173a95" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a1330" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chores">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- first launch -->
<div id="welcome" class="sheet" style="top:0;border-radius:0;max-height:100vh">
  <div class="sbar" style="border-radius:0"><h2>Who's using this device?</h2></div>
  <div class="body">
    <p style="margin:0;color:var(--text-2);font-size:14.5px;text-align:center">
      Pick your name. It's remembered, so you'll only ever see your own chores.
    </p>
    <div class="group" id="pickWho"></div>
    <p style="margin:0;color:var(--text-3);font-size:12.5px;text-align:center">
      A parent can turn on Parent mode later in Settings to edit chores and balances.
    </p>
  </div>
</div>

<div id="app">
  <header class="hdr">
    <div class="inner">
      <div class="eyebrow" id="hEyebrow">--</div>
      <h1 id="hTitle">--</h1>
      <div class="sub" id="hSub">--</div>
    </div>
  </header>

  <div class="wrap">
    <section class="screen on" id="s-home"  role="tabpanel" aria-label="Household"></section>
    <section class="screen"    id="s-chores" role="tabpanel" aria-label="Chores"></section>
    <section class="screen"    id="s-chart"  role="tabpanel" aria-label="Chart"></section>
    <section class="screen"    id="s-money"  role="tabpanel" aria-label="Balances"></section>
    <section class="screen"    id="s-set"    role="tabpanel" aria-label="Settings"></section>
  </div>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
</div>

<datalist id="catlist">
  <option value="Bedroom"></option><option value="Hygiene"></option>
  <option value="Personal Development"></option><option value="Kitchen"></option>
  <option value="Dining Room"></option><option value="Living Room"></option>
  <option value="Bathroom"></option><option value="Laundry"></option>
  <option value="Stairs"></option><option value="Dogs"></option>
  <option value="Sweep &amp; Mop"></option><option value="Family Reset Day"></option>
  <option value="Zion's Jobs"></option>
</datalist>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sbar">
    <button type="button" id="sheetCancel">Cancel</button>
    <h2 id="sheetTitle">--</h2>
    <button type="button" id="sheetSave" class="strong">Save</button>
  </div>
  <div class="body" id="sheetBody"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
