<!-- /launch images -->
<link rel="stylesheet" href="app.css">
<style>
/* Inline so the launch screen paints before app.css even arrives. */
#boot{position:fixed;inset:0;z-index:99;display:grid;place-items:center;
      background:linear-gradient(168deg,#1e4bc0,#122a6e)}
</style>
</head>
<body>

<div id="boot" role="status" aria-label="Loading">
  <div class="mark">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path fill="#ffc12e" stroke="#14122a" stroke-width="1.6" stroke-linejoin="round"
            d="M12 2.2l3 6.5 7.1.9-5.3 4.8 1.4 7L12 17.9 5.8 21.4l1.4-7L1.9 9.6l7.1-.9z"/>
    </svg>
    <div class="nm">Family Chores</div>
    <div class="dots"><i></i><i></i><i></i></div>
  </div>
</div>

<!-- first launch -->
<div id="welcome" class="sheet" style="top:0;border-radius:0;max-height:100vh">
  <div class="sbar" style="border-radius:0"><h2>Who's using this device?</h2></div>
  <div class="body">
    <p style="margin:0;color:var(--text-2);font-size:14.5px;text-align:center">
      Pick your name. It's remembered, so you'll only ever see your own chores.
    </p>
    <div class="group" id="pickWho"></div>
    <p style="margin:0;color:var(--text-3);font-size:12.5px;text-align:center">
      A parent can turn on Parent mode later in Settings to edit chores and balances.
    </p>
  </div>
</div>

<div id="app">
  <header class="hdr">
    <div class="inner">
      <div class="eyebrow" id="hEyebrow">--</div>
      <h1 id="hTitle">--</h1>
      <div class="sub" id="hSub">--</div>
    </div>
  </header>

  <div class="wrap">
    <section class="screen on" id="s-home"  role="tabpanel" aria-label="Household"></section>
    <section class="screen"    id="s-chores" role="tabpanel" aria-label="Chores"></section>
    <section class="screen"    id="s-chart"  role="tabpanel" aria-label="Chart"></section>
    <section class="screen"    id="s-money"  role="tabpanel" aria-label="Balances"></section>
    <section class="screen"    id="s-set"    role="tabpanel" aria-label="Settings"></section>
  </div>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
</div>

<!-- Filled from the real chore categories at runtime, so the served HTML
     carries no names and the suggestions never drift out of sync. -->
<datalist id="catlist"></datalist>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sbar">
    <button type="button" id="sheetCancel">Cancel</button>
    <h2 id="sheetTitle">--</h2>
    <button type="button" id="sheetSave" class="strong">Save</button>
  </div>
  <div class="body" id="sheetBody"></div>
</div>

<div class="install" id="install">
  <span class="ico"><img src="icons/icon-192.png" alt="" onerror="this.parentNode.style.display='none'"></span>
  <span style="flex:1;min-width:0">
    <span class="t">Add Chores to your Home Screen</span>
    <span class="s" id="installHow"></span>
    <button class="btn go hide" id="installGo" type="button">Install</button>
  </span>
  <button class="x" id="installX" type="button" aria-label="Dismiss">&times;</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
