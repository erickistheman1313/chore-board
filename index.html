<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Chore Schedule</title>
<meta name="description" content="Daily chore board for Isabel, Nuno and Zion.">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b6ac4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chores">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
</head>
<body>

<style>
/* ═══════════ TOKENS ═══════════ */
:root{
  --sky-1:#8fd8ff; --sky-2:#4aa8f0; --sky-3:#1b6ac4;
  --gold:#ffc12e; --gold-hi:#ffe278; --flame:#f0562a; --flame-lo:#c2401b;
  --bubble:#ff5f9e; --kelp:#4ec06a; --grape:#8a6cd6; --clay:#a9713c;
  --ink:#14122a;
  --card:#fffdf6; --card-2:#fff5e0;
  --text:#191631; --muted:#6b6489; --rule:#ddd0b4;
  --hard:#14122a;
  --cloud:rgba(255,255,255,.92);
  --star-op:0;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root{
    --sky-1:#1b2150; --sky-2:#121736; --sky-3:#0b0d22;
    --gold:#ffcf4f; --gold-hi:#fff0b0; --flame:#ff7a4d; --flame-lo:#d8492a;
    --bubble:#ff7fb2; --kelp:#5fd07f; --grape:#a48ce6; --clay:#c98f56;
    --ink:#05061a;
    --card:#1a1d3c; --card-2:#222650;
    --text:#eceafd; --muted:#a09cca; --rule:#3a3f78;
    --hard:#05061a;
    --cloud:rgba(120,150,220,.14);
    --star-op:1;
  }
}
:root[data-theme="dark"]{
  --sky-1:#1b2150; --sky-2:#121736; --sky-3:#0b0d22;
  --gold:#ffcf4f; --gold-hi:#fff0b0; --flame:#ff7a4d; --flame-lo:#d8492a;
  --bubble:#ff7fb2; --kelp:#5fd07f; --grape:#a48ce6; --clay:#c98f56;
  --ink:#05061a;
  --card:#1a1d3c; --card-2:#222650;
  --text:#eceafd; --muted:#a09cca; --rule:#3a3f78;
  --hard:#05061a;
  --cloud:rgba(120,150,220,.14);
  --star-op:1;
}
:root[data-theme="light"]{
  --sky-1:#8fd8ff; --sky-2:#4aa8f0; --sky-3:#1b6ac4;
  --gold:#ffc12e; --gold-hi:#ffe278; --flame:#f0562a; --flame-lo:#c2401b;
  --bubble:#ff5f9e; --kelp:#4ec06a; --grape:#8a6cd6; --clay:#a9713c;
  --ink:#14122a;
  --card:#fffdf6; --card-2:#fff5e0;
  --text:#191631; --muted:#6b6489; --rule:#ddd0b4;
  --hard:#14122a;
  --cloud:rgba(255,255,255,.92);
  --star-op:0;
}

/* ═══════════ BASE ═══════════ */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  font-size:16px;line-height:1.5;
  background:var(--sky-3);
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}

/* Cel sky backdrop: gradient + sun burst + clouds (day) or stars (night) */
.sky{position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 46%,var(--sky-3) 100%)}
.sky::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 50% -8%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 42%),
    repeating-conic-gradient(from 0deg at 50% -6%, rgba(255,255,255,.13) 0deg 4deg, rgba(255,255,255,0) 4deg 12deg);
}
.sky::after{
  content:"";position:absolute;inset:0;opacity:calc(1 - var(--star-op));
  background:
    radial-gradient(42px 22px at 12% 16%, var(--cloud) 60%, transparent 62%),
    radial-gradient(30px 17px at 19% 19%, var(--cloud) 60%, transparent 62%),
    radial-gradient(52px 26px at 82% 9%,  var(--cloud) 60%, transparent 62%),
    radial-gradient(34px 19px at 73% 12%, var(--cloud) 60%, transparent 62%),
    radial-gradient(46px 24px at 30% 62%, var(--cloud) 60%, transparent 62%),
    radial-gradient(38px 20px at 88% 48%, var(--cloud) 60%, transparent 62%);
}
.stars{
  position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:var(--star-op);
  background:
    radial-gradient(1.4px 1.4px at 14% 12%, #fff 50%, transparent 52%),
    radial-gradient(1.2px 1.2px at 71% 8%,  #fff 50%, transparent 52%),
    radial-gradient(1.6px 1.6px at 38% 27%, #ffe9a8 50%, transparent 52%),
    radial-gradient(1.2px 1.2px at 88% 31%, #fff 50%, transparent 52%),
    radial-gradient(1.4px 1.4px at 23% 46%, #fff 50%, transparent 52%),
    radial-gradient(1.2px 1.2px at 62% 58%, #cfe4ff 50%, transparent 52%),
    radial-gradient(1.5px 1.5px at 91% 68%, #fff 50%, transparent 52%),
    radial-gradient(1.2px 1.2px at 8%  77%, #fff 50%, transparent 52%);
}

.wrap{
  max-width:720px;margin:0 auto;
  padding:calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 168px calc(14px + env(safe-area-inset-left));
  display:flex;flex-direction:column;gap:16px;
}

/* ═══════════ TYPE ═══════════ */
.display{
  font-family:Impact,Haettenschweiler,"Arial Black","Helvetica Neue",sans-serif;
  font-weight:400;text-transform:uppercase;letter-spacing:.02em;line-height:.94;
  transform:skewX(-7deg);
}
.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,"SF Mono",Consolas,monospace}

/* ═══════════ MASTHEAD ═══════════ */
.masthead{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;padding-top:4px}
.masthead h1{
  margin:0;font-size:clamp(36px,10.5vw,62px);
  background:linear-gradient(178deg,var(--gold-hi) 4%,var(--gold) 34%,var(--flame) 74%,var(--flame-lo) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;
  filter:drop-shadow(0 4px 0 var(--ink)) drop-shadow(0 0 14px rgba(0,0,0,.28));
  text-wrap:balance;
}
.ribbon{
  background:var(--bubble);color:#fff;border:3px solid var(--ink);border-radius:999px;
  padding:5px 20px;font-size:13px;letter-spacing:.09em;box-shadow:0 3px 0 var(--ink);
}

/* ═══════════ HERO CHIP (who am I) ═══════════ */
.herochip{
  display:flex;align-items:center;gap:12px;width:100%;
  appearance:none;font:inherit;text-align:left;cursor:pointer;color:var(--text);
  background:var(--card);border:3px solid var(--ink);border-radius:var(--r);
  padding:10px 14px;box-shadow:0 5px 0 var(--ink);
}
.herochip .av{flex:none}
.herochip .who-n{font-family:Impact,Haettenschweiler,"Arial Black",sans-serif;text-transform:uppercase;font-size:22px;letter-spacing:.03em;line-height:1}
.herochip .who-a{font-size:12px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.herochip .swap{margin-left:auto;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--rule);border-radius:8px;padding:4px 9px}

.av{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:var(--ac);box-shadow:0 2px 0 var(--ink);overflow:hidden;display:block}
.av svg{display:block;width:100%;height:100%}

/* ═══════════ ASSIGNMENT BANNER ═══════════ */
.assign{
  border:3px solid var(--ink);border-radius:var(--r);overflow:hidden;
  box-shadow:0 5px 0 var(--ink);background:var(--card);
}
.assign .top{
  padding:9px 14px;color:#fff;background:linear-gradient(100deg,var(--ac),color-mix(in srgb,var(--ac) 55%, var(--ink)));
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-bottom:3px solid var(--ink);
}
.assign .top b{font-family:Impact,Haettenschweiler,"Arial Black",sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:17px}
.assign .top .dt{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;opacity:.92}
.assign .bot{padding:9px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card-2)}
.lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
select,input[type=email]{
  font:inherit;font-size:15px;color:var(--text);background:var(--card);
  border:2.5px solid var(--ink);border-radius:9px;padding:7px 10px;min-height:38px;
}
select{max-width:170px}

/* ═══════════ SCOUTER / POWER METER ═══════════ */
.scouter{
  position:sticky;top:calc(6px + env(safe-area-inset-top));z-index:20;
  background:linear-gradient(180deg,var(--card),var(--card-2));
  border:3px solid var(--ink);border-radius:var(--r);box-shadow:0 5px 0 var(--ink);
  padding:11px 13px;display:flex;flex-direction:column;gap:8px;
}
.scouter .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.scouter .cap{font-family:Impact,Haettenschweiler,"Arial Black",sans-serif;text-transform:uppercase;letter-spacing:.09em;font-size:13px;color:var(--muted)}
.scouter .num{font-family:Impact,Haettenschweiler,"Arial Black",sans-serif;font-size:30px;letter-spacing:.01em;line-height:1;color:var(--flame)}
.track{
  height:22px;border:3px solid var(--ink);border-radius:999px;overflow:hidden;position:relative;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.16) 0 2px, transparent 2px 16px),
    color-mix(in srgb, var(--ink) 14%, transparent);
}
.fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--gold-hi),var(--gold) 45%,var(--flame));
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.16);
  transition:width .34s cubic-bezier(.3,1.35,.5,1);
}
.scouter.maxed .fill{background:linear-gradient(90deg,#fff,var(--gold-hi),#fff);box-shadow:0 0 18px var(--gold)}
.scouter.maxed .num{color:var(--kelp)}
.streak{
  display:inline-flex;align-items:baseline;gap:6px;
  font-family:Impact,Haettenschweiler,"Arial Black",sans-serif;text-transform:uppercase;
  font-size:11.5px;letter-spacing:.07em;color:var(--ink);
  background:linear-gradient(180deg,var(--gold-hi),var(--gold));
  border:2.5px solid var(--ink);border-radius:999px;padding:3px 12px;box-shadow:0 2px 0 var(--ink);
}
.streak b{font-size:16px;line-height:1}
.streak.cold{background:var(--card-2);color:var(--muted);border-color:var(--rule);box-shadow:0 2px 0 var(--rule)}
.mini{
  appearance:none;font:inherit;font-size:11.5px;cursor:pointer;color:var(--muted);background:var(--card);
  border:2px solid var(--rule);border-radius:8px;padding:6px 11px;text-transform:uppercase;letter-spacing:.07em;min-height:34px;
}
.mini:hover:not(:disabled){color:var(--text);border-color:var(--ink)}
.mini:disabled{opacity:.45;cursor:not-allowed}

/* ═══════════ CHORE CARDS ═══════════ */
.deck{display:flex;flex-direction:column;gap:15px}
.card{
  background:var(--card);border:3px solid var(--ink);border-radius:var(--r);
  box-shadow:0 5px 0 var(--ink);overflow:hidden;position:relative;
}
.card > h2{
  margin:0;padding:10px 14px;display:flex;align-items:center;gap:10px;
  font-family:Impact,Haettenschweiler,"Arial Black",sans-serif;text-transform:uppercase;
  font-size:17px;letter-spacing:.05em;color:#fff;
  background:linear-gradient(100deg,var(--ch),color-mix(in srgb,var(--ch) 58%, var(--ink)));
  border-bottom:3px solid var(--ink);
  text-shadow:0 2px 0 rgba(0,0,0,.28);
}
.card > h2 .tally{
  margin-left:auto;font-size:12px;letter-spacing:.04em;text-shadow:none;
  background:rgba(0,0,0,.3);padding:3px 10px;border-radius:999px;
}
.card.done > h2 .tally{background:var(--kelp);color:#08210f}
.card .note{margin:0;padding:10px 14px 0;font-size:12.5px;color:var(--muted)}
ul.list{list-style:none;margin:0;padding:6px 8px}
ul.list li + li{border-top:2px dashed var(--rule)}

.item{
  display:flex;align-items:flex-start;gap:13px;padding:12px 8px;cursor:pointer;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;position:relative;
}
.item input{position:absolute;opacity:0;width:0;height:0}
.box{
  flex:none;width:30px;height:30px;margin-top:1px;position:relative;
  border:3px solid var(--ink);border-radius:9px;background:var(--card-2);
  box-shadow:0 2px 0 var(--ink);
  transition:background .14s ease, transform .14s ease;
}
.box::after{
  content:"";position:absolute;left:9px;top:3px;width:7px;height:15px;
  border:solid var(--ink);border-width:0 4.5px 4.5px 0;
  transform:rotate(42deg) scale(.25);opacity:0;
  transition:transform .18s cubic-bezier(.3,1.8,.5,1), opacity .12s ease;
}
.item input:checked ~ .box{background:linear-gradient(180deg,var(--gold-hi),var(--gold));transform:scale(1.04)}
.item input:checked ~ .box::after{opacity:1;transform:rotate(42deg) scale(1)}
.item input:focus-visible ~ .box{outline:3px solid var(--flame);outline-offset:3px}
.item .txt{font-size:16px;line-height:1.34;padding-top:3px}
.item input:checked ~ .txt{color:var(--muted);text-decoration:line-through;text-decoration-thickness:2.5px}
.item .sub{display:block;font-size:12px;color:var(--muted);text-decoration:none;margin-top:2px}

/* little star burst when a box is ticked */
.pop{position:absolute;left:15px;top:16px;width:0;height:0;pointer-events:none}
.pop i{position:absolute;width:5px;height:5px;background:var(--gold);border-radius:1px;opacity:0}
.item input:checked ~ .pop i{animation:pop .46s ease-out}
.item input:checked ~ .pop i:nth-child(1){--dx:-20px;--dy:-16px}
.item input:checked ~ .pop i:nth-child(2){--dx:20px;--dy:-17px}
.item input:checked ~ .pop i:nth-child(3){--dx:-17px;--dy:16px}
.item input:checked ~ .pop i:nth-child(4){--dx:19px;--dy:15px}
.item input:checked ~ .pop i:nth-child(5){--dx:0;--dy:-24px}
@keyframes pop{0%{opacity:1;transform:translate(0,0) scale(1) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2) rotate(140deg)}}

/* ═══════════ FINISH BAR ═══════════ */
.finish{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  border-top:3px solid var(--ink);
  background:color-mix(in srgb, var(--card) 90%, transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  padding:10px calc(14px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
}
.finish .inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:9px}
.mailrow{display:flex;align-items:center;gap:8px}
.mailrow input{flex:1;min-width:0}
.btn{
  appearance:none;font:inherit;cursor:pointer;width:100%;min-height:56px;
  font-family:Impact,Haettenschweiler,"Arial Black",sans-serif;text-transform:uppercase;
  font-size:22px;letter-spacing:.05em;color:#fff;
  padding:13px 16px;border:3px solid var(--ink);border-radius:var(--r);
  background:linear-gradient(180deg,var(--flame),var(--flame-lo));
  box-shadow:0 5px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.3);
  touch-action:manipulation;transition:transform .1s ease, box-shadow .1s ease;
}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{
  cursor:not-allowed;color:var(--muted);text-shadow:none;
  background:var(--card-2);border-color:var(--rule);box-shadow:0 5px 0 var(--rule);
}
.btn.ready{animation:throb 1.5s ease-in-out infinite}
@keyframes throb{0%,100%{box-shadow:0 5px 0 var(--ink)}50%{box-shadow:0 5px 0 var(--ink),0 0 22px var(--gold)}}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* ═══════════ CHARACTER SELECT ═══════════ */
.select{
  position:fixed;inset:0;z-index:60;display:none;
  background:linear-gradient(180deg,var(--sky-1),var(--sky-3));
  padding:calc(20px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));
  overflow-y:auto;
}
.select.on{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.select h2{margin:0;text-align:center;font-size:clamp(28px,8vw,44px);color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;filter:drop-shadow(0 4px 0 var(--ink))}
.heroes{display:flex;flex-direction:column;gap:14px;width:100%;max-width:420px}
.hero{
  appearance:none;font:inherit;cursor:pointer;text-align:left;color:var(--text);
  display:flex;align-items:center;gap:14px;
  background:var(--card);border:3px solid var(--ink);border-radius:var(--r);
  padding:13px 15px;box-shadow:0 6px 0 var(--ink);min-height:74px;
  transition:transform .12s ease, box-shadow .12s ease;
}
.hero:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.hero .av{width:56px;height:56px}
.hero .nm{font-family:Impact,Haettenschweiler,"Arial Black",sans-serif;text-transform:uppercase;font-size:26px;letter-spacing:.03em;line-height:1}
.hero .ag{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.hero .go{margin-left:auto;font-family:Impact,Haettenschweiler,"Arial Black",sans-serif;font-size:15px;color:#fff;background:var(--ac);border:2.5px solid var(--ink);border-radius:999px;padding:5px 14px;text-transform:uppercase;letter-spacing:.05em}

/* ═══════════ FX ═══════════ */
#fx{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;transition:opacity .3s ease}
#fx.on{opacity:1}
.toast{
  position:fixed;left:50%;bottom:calc(136px + env(safe-area-inset-bottom));z-index:50;
  transform:translateX(-50%) translateY(12px);
  background:var(--kelp);color:#08210f;border:3px solid var(--ink);border-radius:999px;
  padding:9px 20px;font-size:14px;font-weight:600;box-shadow:0 4px 0 var(--ink);
  opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;max-width:88vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.footnote{text-align:center;font-size:11.5px;color:rgba(255,255,255,.82);text-shadow:0 1px 2px rgba(0,0,0,.4)}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}
</style>

<div class="sky" aria-hidden="true"></div>
<div class="stars" aria-hidden="true"></div>

<div class="wrap">
  <header class="masthead">
    <h1 class="display">Family Chore Schedule</h1>
    <span class="ribbon display">Teamwork makes the dream work!</span>
  </header>

  <button class="herochip" id="heroChip" type="button">
    <span class="av" id="chipAv"></span>
    <span>
      <span class="who-n" id="chipName">—</span><br>
      <span class="who-a" id="chipAge">—</span>
    </span>
    <span class="swap">Switch</span>
  </button>

  <section class="assign" id="assign">
    <div class="top">
      <b id="assignTitle">—</b>
      <span class="dt" id="assignDate">—</span>
    </div>
    <div class="bot">
      <span class="lbl">Showing</span>
      <select id="daySel" aria-label="Which day's chores"></select>
      <button class="mini" id="clearBtn" type="button" style="margin-left:auto">Clear day</button>
    </div>
  </section>

  <div class="scouter" id="scouter">
    <div class="row">
      <span class="cap">Power Level</span>
      <span class="num mono" id="pct">0%</span>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="row">
      <span class="cap" id="countLine">0 of 0 done</span>
      <span class="streak cold" id="streak"></span>
    </div>
  </div>

  <main class="deck" id="deck"></main>

  <p class="footnote">Saves on this device. Starts fresh every new day.</p>
</div>

<div class="finish">
  <div class="inner">
    <div class="mailrow">
      <input type="email" id="dadEmail" placeholder="Dad's email address" autocomplete="email" inputmode="email" aria-label="Dad's email address">
      <button class="mini" id="copyBtn" type="button" disabled>Copy</button>
    </div>
    <button class="btn" id="doneBtn" type="button" disabled>Finish all chores to unlock</button>
  </div>
</div>

<div class="select" id="charSelect" role="dialog" aria-modal="true" aria-label="Choose who you are">
  <h2 class="display">Choose your hero</h2>
  <div class="heroes" id="heroes"></div>
</div>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ───────── storage that never throws ───────── */
var store = (function(){
  try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return localStorage; }
  catch(e){ var m={}; return {getItem:function(k){return k in m?m[k]:null;},setItem:function(k,v){m[k]=String(v);},removeItem:function(k){delete m[k];}}; }
})();

/* ───────── hero portraits ───────── */
var SKIN = "#f6cda6", SKIN2 = "#e8b98c";
function avatar(kind){
  var ink = "#14122a";
  if(kind === "isabel"){
    return '<svg viewBox="0 0 64 64">' +
      '<path d="M9 44c0-24 10-34 23-34s23 10 23 34v18H43c0-8-4-12-11-12s-11 4-11 12H9z" fill="#2b1d3f"/>' +
      '<circle cx="32" cy="34" r="14" fill="'+SKIN+'"/>' +
      '<path d="M18 30c1-13 7-18 14-18s13 5 14 18c-3-8-8-10-14-9s-11 4-14 9z" fill="#2b1d3f"/>' +
      '<circle cx="26" cy="35" r="2.4" fill="'+ink+'"/><circle cx="38" cy="35" r="2.4" fill="'+ink+'"/>' +
      '<path d="M28 42c2 2 6 2 8 0" stroke="'+ink+'" stroke-width="2" fill="none" stroke-linecap="round"/>' +
      '</svg>';
  }
  if(kind === "nuno"){
    return '<svg viewBox="0 0 64 64">' +
      '<path d="M32 4l6 11 7-8-1 12 11-5-8 10 12 2-11 6H15L4 26l12-2-8-10 11 5-1-12 7 8z" fill="#1d1630"/>' +
      '<circle cx="32" cy="36" r="14" fill="'+SKIN+'"/>' +
      '<path d="M18 32c2-10 7-14 14-14s12 4 14 14c-4-6-8-8-14-8s-10 2-14 8z" fill="#1d1630"/>' +
      '<circle cx="26" cy="37" r="2.4" fill="'+ink+'"/><circle cx="38" cy="37" r="2.4" fill="'+ink+'"/>' +
      '<path d="M27 44c3 2 7 2 10 0" stroke="'+ink+'" stroke-width="2" fill="none" stroke-linecap="round"/>' +
      '</svg>';
  }
  return '<svg viewBox="0 0 64 64">' +
    '<path d="M32 10l5 9 6-6-1 10 9-4-6 8 9 2-9 5H19l-9-5 9-2-6-8 9 4-1-10 6 6z" fill="#17102a"/>' +
    '<circle cx="32" cy="38" r="15" fill="'+SKIN+'"/>' +
    '<path d="M17 35c2-9 7-13 15-13s13 4 15 13c-4-6-9-8-15-8s-11 2-15 8z" fill="#17102a"/>' +
    '<circle cx="25" cy="39" r="2.7" fill="'+ink+'"/><circle cx="39" cy="39" r="2.7" fill="'+ink+'"/>' +
    '<path d="M26 45c4 4 8 4 12 0" stroke="'+ink+'" stroke-width="2.4" fill="none" stroke-linecap="round"/>' +
    '<circle cx="20" cy="52" r="3" fill="'+SKIN2+'" opacity=".8"/><circle cx="44" cy="52" r="3" fill="'+SKIN2+'" opacity=".8"/>' +
    '</svg>';
}

/* ───────── the chart, transcribed ───────── */
var DAILY = [
  {id:"bed", title:"Every Day — Bedroom", color:"var(--bubble)", items:[
    "Make bed",
    "Put dirty clothes in hamper",
    "Put clean clothes away (fold or hang)",
    "Pick up anything on the floor",
    "Throw away trash",
    "Keep desk / dresser neat and organized"
  ]},
  {id:"dev", title:"Personal Development", color:"var(--kelp)", items:[
    "Read for 15 minutes",
    "Write in gratitude journal",
    "List 3 things I am grateful for today",
    {t:"Study AI for 1 hour", s:"Summer goal: 6 hours per day minimum"}
  ]},
  {id:"hyg", title:"Hygiene", color:"var(--sky-2)", items:["Brush teeth","Take a shower"]}
];

var CHORE_A = [
  {id:"a-kit", title:"Kitchen", color:"var(--flame)", items:[
    "Wash all dishes","Wipe down countertops","Wipe down stovetop","Clean microwave (inside and out)","Empty trash"]},
  {id:"a-din", title:"Dining Room", color:"var(--bubble)", items:["Wipe down dining room table"]},
  {id:"a-liv", title:"Living Room", color:"var(--grape)", items:[
    "Pick up items that don't belong","Dust surfaces","Wipe down tables","Vacuum floor"]},
  {id:"a-bath", title:"Bathroom", color:"var(--kelp)", items:[
    "Scrub toilet (inside and out)","Clean mirrors","Wipe sink"]},
  {id:"a-dogs", title:"Dogs", color:"var(--clay)", items:["Walk dogs","Pick up after dogs"]}
];
var A_MOP = {id:"a-mop", title:"Sweep & Mop", color:"var(--gold)", note:"Monday and Thursday only.", items:[
  "Sweep & mop kitchen","Sweep & mop living room","Sweep & mop dining room","Sweep & mop bathroom"]};

var CHORE_B = [
  {id:"b-bath", title:"Bathroom", color:"var(--sky-2)", items:[
    "Scrub toilet (inside and out)","Scrub tub / shower","Wipe counters","Clean mirrors","Wipe sink"]},
  {id:"b-laun", title:"Laundry", color:"var(--bubble)", items:[
    "Collect dirty laundry","Sort laundry","Wash laundry","Transfer laundry to dryer","Fold clothes","Put clothes away"]},
  {id:"b-stair", title:"Stairs", color:"var(--flame)", items:["Pick up items left on stairs"]},
  {id:"b-dogs", title:"Dogs", color:"var(--clay)", items:["Walk dogs","Pick up after dogs"]}
];
var B_MOP = {id:"b-mop", title:"Sweep & Mop", color:"var(--gold)", note:"Monday and Thursday only.", items:[
  "Sweep & mop bathroom","Sweep & mop hallway","Sweep & mop stairs"]};

var RESET = [{id:"reset", title:"Family Reset Day", color:"var(--flame)", note:"Everyone works together.", items:[
  "Pick up and organize common areas","Take out all trash","Check bedrooms for clutter",
  "Finish any missed chores from the week","Prepare the house for the weekend"]}];

var ZION = [{id:"z-day", title:"Every Day", color:"var(--gold)", items:[
  "Feed the dogs","Refill dog water bowls","Fix couch cushions and blankets","Pick up toys and put them away"]}];

var PEOPLE = [
  {key:"isabel", name:"Isabel", age:"15 · Girl", color:"var(--bubble)"},
  {key:"nuno",   name:"Nuno",   age:"13 · Boy",  color:"var(--sky-2)"},
  {key:"zion",   name:"Zion",   age:"5 · Boy",   color:"var(--gold)"}
];

/* Weekly rotation, straight off the poster. 1=Mon … 5=Fri */
var ROTATION = {
  1:{nuno:"B", isabel:"A"},
  2:{nuno:"A", isabel:"B"},
  3:{nuno:"B", isabel:"A"},
  4:{nuno:"A", isabel:"B"},
  5:{nuno:"R", isabel:"R"}
};
var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

/* ───────── state ───────── */
var el = function(id){ return document.getElementById(id); };
var today = new Date();
var person = store.getItem("cs.person");
var viewDow = today.getDay();

function dateKey(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function checksKey(){ return "cs.checks."+person+"."+dateKey(today); }
function loadChecks(){ try{ return JSON.parse(store.getItem(checksKey())||"{}")||{}; }catch(e){ return {}; } }
var checks = {};
function saveChecks(){ store.setItem(checksKey(), JSON.stringify(checks)); }
function me(){ return PEOPLE.filter(function(p){return p.key===person;})[0]; }

function sectionsFor(pk, dow){
  if(pk === "zion") return ZION.slice();
  var out = DAILY.slice();
  var rot = ROTATION[dow];
  if(!rot) return out;                                  /* Saturday & Sunday */
  var code = rot[pk];
  if(code === "R") return out.concat(RESET);
  if(code === "A") return out.concat(CHORE_A, (dow===1||dow===4) ? [A_MOP] : []);
  return out.concat(CHORE_B, (dow===1||dow===4) ? [B_MOP] : []);
}
function assignmentLabel(pk, dow){
  if(pk === "zion") return "Daily Responsibilities";
  var rot = ROTATION[dow];
  if(!rot) return "Weekend — Daily Only";
  var code = rot[pk];
  if(code === "R") return "Family Reset Day";
  return code === "A" ? "Chore A — Downstairs" : "Chore B — Upstairs";
}
/* ───────── streaks ─────────
   A streak only counts for the real today, so browsing Monday's list on a
   Tuesday can never award one. Missing a day drops you back to zero. */
function shiftKey(days){
  var d = new Date(today.getTime());
  d.setDate(d.getDate() + days);
  return dateKey(d);
}
function loadStreak(){
  try{ return JSON.parse(store.getItem("cs.streak."+person)||"null") || {n:0,last:""}; }
  catch(e){ return {n:0,last:""}; }
}
function currentStreak(){
  var s = loadStreak();
  if(s.last === dateKey(today) || s.last === shiftKey(-1)) return s.n;
  return 0;                                    /* chain broken */
}
function bumpStreak(){
  var s = loadStreak(), tk = dateKey(today);
  if(s.last === tk) return s.n;                /* already counted today */
  s.n = (s.last === shiftKey(-1)) ? s.n + 1 : 1;
  s.last = tk;
  store.setItem("cs.streak."+person, JSON.stringify(s));
  return s.n;
}
function paintStreak(){
  var n = currentStreak(), e = el("streak");
  e.classList.toggle("cold", n === 0);
  e.innerHTML = n === 0
    ? "No streak yet"
    : "<b>" + n + "</b> day" + (n === 1 ? "" : "s") + " in a row";
}

function itemText(it){ return typeof it === "string" ? it : it.t; }
function itemSub(it){ return typeof it === "string" ? null : it.s; }

/* ───────── character select ───────── */
function buildHeroes(){
  var h = el("heroes");
  h.innerHTML = "";
  PEOPLE.forEach(function(p){
    var b = document.createElement("button");
    b.type = "button"; b.className = "hero";
    b.style.setProperty("--ac", p.color);
    b.innerHTML = '<span class="av">'+avatar(p.key)+'</span>' +
                  '<span><span class="nm">'+p.name+'</span><br><span class="ag">'+p.age+'</span></span>' +
                  '<span class="go">Go</span>';
    b.addEventListener("click", function(){ pick(p.key); });
    h.appendChild(b);
  });
}
function pick(key){
  person = key;
  store.setItem("cs.person", key);
  checks = loadChecks();
  el("charSelect").classList.remove("on");
  document.body.style.overflow = "";
  paintHero(); renderDeck(); update(true);
}
function openSelect(){
  el("charSelect").classList.add("on");
  document.body.style.overflow = "hidden";
}
function paintHero(){
  var p = me();
  el("chipAv").innerHTML = avatar(p.key);
  el("chipAv").style.setProperty("--ac", p.color);
  el("chipName").textContent = p.name;
  el("chipAge").textContent = p.age;
  el("assign").style.setProperty("--ac", p.color);
}

/* ───────── render ───────── */
var deck = el("deck");

function renderDaySel(){
  var s = el("daySel");
  s.innerHTML = "";
  [1,2,3,4,5,6,0].forEach(function(d){
    var o = document.createElement("option");
    o.value = String(d);
    o.textContent = DAYS[d] + (d === today.getDay() ? " (today)" : "");
    if(d === viewDow) o.selected = true;
    s.appendChild(o);
  });
}

function renderDeck(){
  deck.innerHTML = "";
  sectionsFor(person, viewDow).forEach(function(sec){
    var card = document.createElement("section");
    card.className = "card";
    card.setAttribute("data-sec", sec.id);
    card.style.setProperty("--ch", sec.color);

    var h = document.createElement("h2");
    h.innerHTML = '<span>'+sec.title+'</span><span class="tally mono"></span>';
    card.appendChild(h);

    if(sec.note){
      var n = document.createElement("p");
      n.className = "note"; n.textContent = sec.note;
      card.appendChild(n);
    }

    var ul = document.createElement("ul");
    ul.className = "list";
    sec.items.forEach(function(it, i){
      var id = sec.id + ":" + i;
      var li = document.createElement("li");
      var lab = document.createElement("label");
      lab.className = "item";
      var sub = itemSub(it);
      lab.innerHTML =
        '<input type="checkbox" data-id="'+id+'" data-sec="'+sec.id+'"'+(checks[id]?" checked":"")+'>' +
        '<span class="box" aria-hidden="true"></span>' +
        '<span class="pop" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>' +
        '<span class="txt">'+itemText(it)+(sub?'<span class="sub">'+sub+'</span>':'')+'</span>';
      lab.querySelector("input").addEventListener("change", function(e){
        if(e.target.checked) checks[id] = 1; else delete checks[id];
        saveChecks(); update();
      });
      li.appendChild(lab);
      ul.appendChild(li);
    });
    card.appendChild(ul);
    deck.appendChild(card);
  });
}

/* ───────── progress ───────── */
var wasComplete = false;

function update(silent){
  var boxes = Array.prototype.slice.call(deck.querySelectorAll("input[type=checkbox]"));
  var total = boxes.length;
  var done = boxes.filter(function(b){return b.checked;}).length;
  var pct = total ? Math.round(done / total * 100) : 0;

  el("pct").textContent = pct + "%";
  el("fill").style.width = pct + "%";
  el("countLine").textContent = done + " of " + total + " done";
  el("scouter").classList.toggle("maxed", total > 0 && done === total);

  deck.querySelectorAll(".card").forEach(function(card){
    var sid = card.getAttribute("data-sec");
    var inSec = boxes.filter(function(b){return b.getAttribute("data-sec")===sid;});
    var d = inSec.filter(function(b){return b.checked;}).length;
    card.querySelector(".tally").textContent = d + "/" + inSec.length;
    card.classList.toggle("done", d === inSec.length && inSec.length > 0);
  });

  var complete = total > 0 && done === total;
  var btn = el("doneBtn");
  btn.disabled = !complete;
  btn.classList.toggle("ready", complete);
  el("copyBtn").disabled = !complete;
  btn.textContent = complete ? "Tell Dad I'm Done"
    : (total - done) + " chore" + (total - done === 1 ? "" : "s") + " left";

  el("assignTitle").textContent = assignmentLabel(person, viewDow);
  el("assignDate").textContent = DAYS[viewDow] + (viewDow === today.getDay()
    ? " · " + today.toLocaleDateString(undefined,{month:"short",day:"numeric"}) : "");

  var viewingToday = viewDow === today.getDay();
  if(complete && !wasComplete && !silent && viewingToday) bumpStreak();
  paintStreak();

  if(complete && !wasComplete && !silent) burst();
  wasComplete = complete;
}

/* ───────── power-up burst ───────── */
var fx = el("fx"), ctx = fx.getContext("2d"), raf = 0;
function sizeFx(){
  var r = window.devicePixelRatio || 1;
  fx.width = innerWidth * r; fx.height = innerHeight * r;
  ctx.setTransform(r,0,0,r,0,0);
}
sizeFx();
addEventListener("resize", sizeFx);

function doneMessage(){
  var n = currentStreak();
  return n > 1 ? "All done — " + n + " days in a row!" : "All chores done — go tell Dad!";
}

function burst(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){ toast(doneMessage()); return; }
  cancelAnimationFrame(raf);
  fx.classList.add("on");
  var t0 = performance.now(), W = innerWidth, H = innerHeight, cx = W/2, cy = H*0.62;
  var rays = [], bits = [];
  for(var i=0;i<26;i++) rays.push({a:Math.random()*Math.PI*2, w:0.012+Math.random()*0.03, s:0.6+Math.random()*0.7});
  for(var j=0;j<34;j++) bits.push({a:Math.random()*Math.PI*2, v:180+Math.random()*340, r:3+Math.random()*4, sp:Math.random()*6});

  (function frame(now){
    var t = (now - t0)/1200;
    if(t >= 1){ ctx.clearRect(0,0,W,H); fx.classList.remove("on"); toast(doneMessage()); return; }
    ctx.clearRect(0,0,W,H);
    var ease = 1 - Math.pow(1-t, 3);

    var g = ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*0.75);
    g.addColorStop(0,"rgba(255,225,120,"+(0.55*(1-t))+")");
    g.addColorStop(1,"rgba(255,180,40,0)");
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    ctx.save(); ctx.translate(cx,cy);
    rays.forEach(function(r){
      var len = Math.max(W,H) * ease * r.s * 1.3;
      ctx.fillStyle = "rgba(255,255,255,"+(0.5*(1-t))+")";
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.lineTo(Math.cos(r.a-r.w)*len, Math.sin(r.a-r.w)*len);
      ctx.lineTo(Math.cos(r.a+r.w)*len, Math.sin(r.a+r.w)*len);
      ctx.closePath(); ctx.fill();
    });
    bits.forEach(function(b){
      var d = b.v * ease, x = Math.cos(b.a)*d, y = Math.sin(b.a)*d + 140*t*t;
      ctx.save(); ctx.translate(x,y); ctx.rotate(b.sp*t*2);
      ctx.fillStyle = "rgba(255,193,46,"+(1-t)+")";
      ctx.fillRect(-b.r/2,-b.r/2,b.r,b.r);
      ctx.restore();
    });
    ctx.restore();
    raf = requestAnimationFrame(frame);
  })(performance.now());
}

var toastTimer;
function toast(msg){
  var t = el("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2800);
}

/* ───────── the report for Dad ───────── */
function buildReport(){
  var p = me();
  var when = today.toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"});
  var secs = sectionsFor(person, viewDow);
  var head = p.name + " finished every chore for " + DAYS[viewDow] + ", " + when + ".\n"
           + assignmentLabel(person, viewDow) + "\n";

  var full = [head];
  secs.forEach(function(sec){
    full.push(sec.title.toUpperCase());
    sec.items.forEach(function(it){ full.push("- " + itemText(it)); });
    full.push("");
  });
  var body = full.join("\n");

  /* Some mail apps drop mailto links past ~2000 characters. Fall back to tallies. */
  if(encodeURIComponent(body).length > 1750){
    var brief = [head];
    secs.forEach(function(sec){ brief.push("- " + sec.title + ": all " + sec.items.length + " done"); });
    brief.push("", "Full checklist is on the chore board.");
    body = brief.join("\n");
  }
  return {
    subject: p.name + " finished all chores - " + DAYS[viewDow] + ", " + today.toLocaleDateString(undefined,{month:"short",day:"numeric"}),
    body: body
  };
}

el("doneBtn").addEventListener("click", function(){
  var addr = el("dadEmail").value.trim();
  if(!addr){ el("dadEmail").focus(); toast("Add Dad's email address first"); return; }
  store.setItem("cs.dad", addr);
  var r = buildReport();
  window.location.href = "mailto:" + encodeURIComponent(addr) +
    "?subject=" + encodeURIComponent(r.subject) + "&body=" + encodeURIComponent(r.body);
  toast("Opening your email app — press send");
});

el("copyBtn").addEventListener("click", function(){
  var r = buildReport(), text = r.subject + "\n\n" + r.body;
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.cssText = "position:fixed;top:-1000px";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("Copied — paste it into Gmail"); }
    catch(e){ toast("Couldn't copy on this device"); }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast("Copied — paste it into Gmail"); }, fallback);
  } else fallback();
});

el("dadEmail").value = store.getItem("cs.dad") || "";
el("dadEmail").addEventListener("change", function(){ store.setItem("cs.dad", el("dadEmail").value.trim()); });

el("daySel").addEventListener("change", function(e){
  viewDow = parseInt(e.target.value, 10);
  renderDeck(); update(true);
});

el("clearBtn").addEventListener("click", function(){
  if(!confirm("Uncheck everything for today?")) return;
  checks = {}; saveChecks();
  renderDeck(); update(true);
  toast("Cleared");
});

el("heroChip").addEventListener("click", openSelect);

/* Rolled past midnight while the app sat open? Re-key to the new day. */
setInterval(function(){
  var now = new Date();
  if(dateKey(now) !== dateKey(today)){
    today = now; viewDow = now.getDay();
    checks = loadChecks();
    renderDaySel(); renderDeck(); update(true);
  }
}, 60000);

/* ───────── boot ───────── */
buildHeroes();
renderDaySel();
if(person && PEOPLE.some(function(p){return p.key===person;})){
  checks = loadChecks();
  paintHero(); renderDeck(); update(true);
} else {
  person = "nuno";
  paintHero(); renderDeck(); update(true);
  openSelect();
}

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){ /* fine without offline */ });
  });
}
})();
</script>
