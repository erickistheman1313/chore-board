<link rel="stylesheet" href="app.css">
<style>
/* Inline so the launch screen paints before app.css even arrives. */
#boot{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:#17140f}
@media (prefers-color-scheme: dark){#boot{background:#0b0a08}}
</style>
</head>
<body>

<!-- One shared foil gradient. Defining it per medallion would repeat the same
     id all over the document; every monogram references this instead. -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <defs>
    <linearGradient id="foil" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0"    stop-color="#f0dcae"/>
      <stop offset="0.34" stop-color="#d9b869"/>
      <stop offset="0.62" stop-color="#a8823a"/>
      <stop offset="1"    stop-color="#7d5f24"/>
    </linearGradient>
    <linearGradient id="foilFaint" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0"    stop-color="#d9b869" stop-opacity=".85"/>
      <stop offset="1"    stop-color="#7d5f24" stop-opacity=".85"/>
    </linearGradient>
  </defs>
</svg>

<div id="boot" role="status" aria-label="Loading">
  <div class="mark">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="18" fill="none" stroke="#a8823a" stroke-width="1"/>
      <circle cx="20" cy="20" r="14.5" fill="none" stroke="#a8823a" stroke-width="1" stroke-dasharray="2 3"/>
      <path d="M20 12.5l2.1 4.6 5 .6-3.7 3.4 1 4.9L20 23.6l-4.4 2.4 1-4.9-3.7-3.4 5-.6z" fill="#d9b869"/>
    </svg>
    <div class="nm">Family Chores</div>
    <div class="est">Est. 2026</div>
  </div>
</div>

<!-- shown on every launch: pick a profile, then that person's PIN -->
<div id="welcome" class="pickscreen" role="dialog" aria-modal="true" aria-label="Choose your profile">
  <div class="pickbox">
    <div class="pick-eyebrow">Family Chore Schedule</div>
    <h2 class="pick-title">Who's here?</h2>
    <div class="fleuron" aria-hidden="true"><i></i><b></b><i></i></div>
    <div class="pickwho" id="pickWho"></div>
    <p class="pick-note">Tap your name, then enter your PIN.</p>
  </div>
</div>

<div id="app">
  <header class="hdr">
    <div class="inner">
      <div class="eyebrow" id="hEyebrow">--</div>
      <h1 id="hTitle">--</h1>
      <div class="sub" id="hSub">--</div>
      <div class="fleuron" aria-hidden="true"><i></i><b></b><i></i></div>
    </div>
  </header>

  <div class="wrap">
    <section class="screen on" id="s-home"  role="tabpanel" aria-label="Household"></section>
    <section class="screen"    id="s-chores" role="tabpanel" aria-label="Chores"></section>
    <section class="screen"    id="s-chart"  role="tabpanel" aria-label="Chart"></section>
    <section class="screen"    id="s-set"    role="tabpanel" aria-label="Settings"></section>
  </div>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
</div>

<!-- Filled from the real chore categories at runtime, so the served HTML
     carries no names and the suggestions never drift out of sync. -->
<datalist id="catlist"></datalist>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sbar">
    <button type="button" id="sheetCancel">Cancel</button>
    <h2 id="sheetTitle">--</h2>
    <button type="button" id="sheetSave" class="strong">Save</button>
  </div>
  <div class="body" id="sheetBody"></div>
</div>

<div class="install" id="install">
  <span class="ico"><img src="icons/icon-192.png" alt="" onerror="this.parentNode.style.display='none'"></span>
  <span style="flex:1;min-width:0">
    <span class="t">Add Chores to your Home Screen</span>
    <span class="s" id="installHow"></span>
    <button class="btn go hide" id="installGo" type="button">Install</button>
  </span>
  <button class="x" id="installX" type="button" aria-label="Dismiss">&times;</button>
</div>

<div class="lock" id="lock" role="dialog" aria-modal="true" aria-label="Enter your PIN">
  <canvas class="snow" id="staticCv" aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="jam" id="jam" role="status" aria-live="polite">
    <div class="jam-plate">
      <div class="jam-label">No Signal</div>
      <div class="jam-time" id="jamTime">0:00</div>
      <div class="jam-sub">Too many wrong tries.<br>The pad comes back when the clock runs out.</div>
      <button type="button" class="jam-switch" id="jamSwitch">Someone else? Switch person</button>
    </div>
  </div>
  <div class="lockbox" id="lockBox">
    <span class="av lg" id="lockAv"></span>
    <div class="who" id="lockName">--</div>
    <h2 id="lockTitle">Enter your PIN</h2>
    <div class="dots" id="lockDots" aria-hidden="true"></div>
    <p class="hint" id="lockHint"></p>
    <div class="keys">
      <button type="button" id="key1">1</button>
      <button type="button" id="key2">2</button>
      <button type="button" id="key3">3</button>
      <button type="button" id="key4">4</button>
      <button type="button" id="key5">5</button>
      <button type="button" id="key6">6</button>
      <button type="button" id="key7">7</button>
      <button type="button" id="key8">8</button>
      <button type="button" id="key9">9</button>
      <span></span>
      <button type="button" id="key0">0</button>
      <button type="button" id="lockDel" aria-label="Delete">&#9003;</button>
    </div>
    <button type="button" class="switch" id="lockSwitch">Not you? Switch person</button>
  </div>
</div>

<div class="seal" id="seal" aria-hidden="true"></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
